set -g mouse on
set -g set-clipboard on

# 마우스 드래그가 끝나면 선택 영역을 시스템 클립보드로 복사 (xclip 필요)
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# 마우스 가운데 버튼으로 시스템 클립보드 내용 붙여넣기
bind -n MouseDown2Pane run "xclip -out -selection clipboard | tmux load-buffer -b mouse - && tmux paste-buffer -b mouse -d"
